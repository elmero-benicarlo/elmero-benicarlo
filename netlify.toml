[build]
  publish = "."

# ── Cabeceras de seguridad ──────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ── Cache: assets estáticos ─────────────────────────────────────────────────
[[headers]]
  for = "*.gif"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# ── Cache: HTML (sin caché para tener siempre la última versión) ────────────
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Rutas y redirects ───────────────────────────────────────────────────────

# /app → app.html (ya funciona por defecto, pero lo hacemos explícito)
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

# /junta → app.html (alias cómodo)
[[redirects]]
  from = "/junta"
  to = "/app.html"
  status = 200

# /admin → app.html (alias)
[[redirects]]
  from = "/admin"
  to = "/app.html"
  status = 200

# 404 personalizado
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
